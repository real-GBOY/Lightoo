<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080908">
<title>LIGHTOO · Offline</title>
<style>
  html,body{margin:0;background:#080908;color:#F1F2EC;font-family:-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  main{min-height:100dvh;display:grid;place-content:center;gap:12px;text-align:center;padding:32px}
  .m{display:inline-flex;align-items:center;font-weight:800;font-size:40px;letter-spacing:-.02em;justify-content:center}
  .m i{width:.7em;height:.7em;border-radius:50%;background:#C8F23A;margin-left:.04em}
  .m b{width:.7em;height:.7em;border-radius:50%;border:.13em solid #F1F2EC;box-sizing:border-box;margin-left:.05em}
  p{margin:0;color:#B0B2AA;line-height:1.45;max-width:320px}
  button{margin-top:12px;min-height:50px;border:0;border-radius:14px;background:#C8F23A;color:#0D0E0D;font:600 16px inherit;padding:0 24px}
</style>
</head>
<body>
<main>
  <div class="m">LIGHT<i></i><b></b></div>
  <p>You are offline and this screen has not been opened on this device yet. Screens you have already visited, and your recorded finds, are available once they have loaded.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
